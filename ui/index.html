<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Political Compass</title>
  <style>
    :root {
      --bg-color: #1e1e24;
      --card-bg: #2a2a33;
      --text-main: #e0dff0;
      --text-muted: #c9a6f5;
      --border-color: #6c3fa0;
      --accent: #9b59d9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

    header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; font-weight: 600; }

    .controls { display: flex; gap: 12px; align-items: center; }
    select, input { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; }
    select:focus, input:focus { border-color: var(--accent); }

    #compass-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 1 / 1; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    canvas { width: 100%; height: 100%; display: block; }

    /* Custom Tooltip */
    #tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      background: rgba(30, 30, 36, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      max-width: 280px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 10;
      transition: opacity 0.1s ease;
    }
    #tooltip h4 { display: flex; align-items: center; gap: 8px; font-size: 1rem; margin-bottom: 6px; }
    .coords-badge { display: inline-block; font-size: 0.75rem; background: rgba(108, 63, 160, 0.3); border: 1px solid var(--border-color); padding: 2px 6px; border-radius: 4px; margin-bottom: 8px; color: var(--text-muted); font-family: monospace; }
    .tooltip-summary { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--text-main); }
    .tooltip-desc { font-size: 0.78rem; color: var(--text-muted); line-height: 1.3; }

    /* Quadrant Label Overlay */
    .quad-label { position: absolute; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; opacity: 0.3; pointer-events: none; }
    .top-left { top: 15px; left: 15px; color: #ef4444; }
    .top-right { top: 15px; right: 15px; color: #3b82f6; }
    .bottom-left { bottom: 15px; left: 15px; color: #22c55e; }
    .bottom-right { bottom: 15px; right: 15px; color: #eab308; }
  </style>
</head>
<body>

  <header>
    <h1>Global Political Compass</h1>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Land suchen...">
      <select id="yearSelect">
        <!-- Dynamisch gefüllt -->
      </select>
    </div>
  </header>

  <div id="compass-container">
    <div class="quad-label top-left">Authoritarian Left</div>
    <div class="quad-label top-right">Authoritarian Right</div>
    <div class="quad-label bottom-left">Libertarian Left</div>
    <div class="quad-label bottom-right">Libertarian Right</div>

    <canvas id="compassCanvas"></canvas>
    
    <div id="tooltip">
      <h4 id="tt-title">Land</h4>
      <div id="tt-coords" class="coords-badge">X: 0 | Y: 0</div>
      <div id="tt-summary" class="tooltip-summary"></div>
      <div id="tt-desc" class="tooltip-desc"></div>
    </div>
  </div>

  <script>
    // --- SAMPLE DEMO FALLBACK DATA ---
    const defaultCountries = [
      { index: 63, name: "Germany", code: "DE" },
      { index: 187, name: "United States", code: "US" },
      { index: 36, name: "China", code: "CN" },
      { index: 170, name: "Switzerland", code: "CH" }
    ];

    const defaultScores = {
      "63": { "2024": { left_right: -25, lib_auth: -40, rubric_id: "eval-63-2024" }, "2025": { left_right: -20, lib_auth: -35, rubric_id: "eval-63-2025" } },
      "187": { "2024": { left_right: 45, lib_auth: 15, rubric_id: "eval-187-2024" }, "2025": { left_right: 50, lib_auth: 20, rubric_id: "eval-187-2025" } },
      "36": { "2024": { left_right: -60, lib_auth: 85, rubric_id: "eval-36-2024" } },
      "170": { "2024": { left_right: 30, lib_auth: -70, rubric_id: "eval-170-2024" } }
    };

    const defaultEvaluations = {
      "evaluations": {
        "eval-63-2024": { summary: "Sozial-ökologische Marktregulierung", justification: { left_right: "Hohe Staatsquote & Umweltauflagen", lib_auth: "Starke Bürgerrechte & Rechtsstaatlichkeit" } },
        "eval-187-2024": { summary: "Deregulierte Marktwirtschaft", justification: { left_right: "Niedrige Unternehmenssteuern", lib_auth: "Zunehmende Skepsis gegenüber Institutionen" } }
      }
    };

    let countriesData = defaultCountries;
    let scoresData = defaultScores;
    let evaluationsData = defaultEvaluations;

    let selectedYear = "2024";
    let searchQuery = "";
    let hoveredCountry = null;

    const canvas = document.getElementById('compassCanvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const yearSelect = document.getElementById('yearSelect');
    const searchInput = document.getElementById('searchInput');

    // --- DATEN LADEN ---
    async function loadData() {
      try {
        const [cRes, sRes, eRes] = await Promise.all([
          fetch('../data/countries.json'),
          fetch('../data/country_scores.json'),
          fetch('../data/evaluations.json')
        ]);
        countriesData = await cRes.json();
        scoresData = await sRes.json();
        evaluationsData = await eRes.json();
      } catch (e) {
        console.warn("JSONs konnten nicht via HTTP geladen werden. Verwende lokale Demo-Daten.", e);
      }
      initUI();
    }

    function initUI() {
      const years = new Set();
      Object.values(scoresData).forEach(c => {
        Object.keys(c).forEach(y => years.add(y));
      });
      const sortedYears = Array.from(years).sort().reverse();
      
      yearSelect.innerHTML = sortedYears.map(y => `<option value="${y}">${y}</option>`).join('');
      if (sortedYears.length > 0) selectedYear = sortedYears[0];

      yearSelect.addEventListener('change', (e) => {
        selectedYear = e.target.value;
        drawCompass();
      });

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        drawCompass();
      });

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      drawCompass();
    }

    // --- COORDINATE MAPPING ---
    function valToPx(leftRight, libAuth) {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      const padding = 40;

      const x = padding + ((leftRight + 100) / 200) * (w - 2 * padding);
      const y = padding + ((100 - libAuth) / 200) * (h - 2 * padding);

      return { x, y };
    }

    function pxToVal(px, py) {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      const padding = 40;

      const leftRight = Math.round((((px - padding) / (w - 2 * padding)) * 200) - 100);
      const libAuth = Math.round(100 - (((py - padding) / (h - 2 * padding)) * 200));

      return { leftRight, libAuth };
    }

    // --- ZEICHNEN ---
    function drawCompass() {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;
      ctx.clearRect(0, 0, w, h);

      // 1. Quadranten-Hintergründe
      const pad = 40;
      const cx = w / 2;
      const cy = h / 2;

      ctx.globalAlpha = 0.08;
      ctx.fillStyle = "#ef4444"; ctx.fillRect(pad, pad, cx - pad, cy - pad);
      ctx.fillStyle = "#3b82f6"; ctx.fillRect(cx, pad, cx - pad, cy - pad);
      ctx.fillStyle = "#22c55e"; ctx.fillRect(pad, cy, cx - pad, cy - pad);
      ctx.fillStyle = "#eab308"; ctx.fillRect(cx, cy, cx - pad, cy - pad);
      ctx.globalAlpha = 1.0;

      // 2. Gitter & Hauptachsen (auf Theme abgestimmt)
      ctx.strokeStyle = "rgba(108, 63, 160, 0.3)";
      ctx.lineWidth = 1;

      // Feines Raster
      for (let i = -80; i <= 80; i += 20) {
        if (i === 0) continue;
        const p = valToPx(i, i);
        ctx.beginPath(); ctx.moveTo(p.x, pad); ctx.lineTo(p.x, h - pad); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pad, p.y); ctx.lineTo(w - pad, p.y); ctx.stroke();
      }

      // Hauptachsen (X = 0, Y = 0)
      ctx.strokeStyle = "#6c3fa0";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, pad); ctx.lineTo(cx, h - pad); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pad, cy); ctx.lineTo(w - pad, cy); ctx.stroke();

      // Achsenbeschriftungen
      ctx.fillStyle = "#c9a6f5";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("LEFT (-100)", pad + 30, cy - 8);
      ctx.fillText("RIGHT (+100)", w - pad - 35, cy - 8);
      ctx.fillText("AUTHORITARIAN (+100)", cx, pad + 15);
      ctx.fillText("LIBERTARIAN (-100)", cx, h - pad - 10);

      // 3. Länderpunkte zeichnen
      const visiblePoints = [];

      countriesData.forEach(country => {
        const cId = String(country.index);
        const score = scoresData[cId]?.[selectedYear];
        if (!score) return;

        const isMatch = searchQuery === "" || country.name.toLowerCase().includes(searchQuery);
        const { x, y } = valToPx(score.left_right, score.lib_auth);

        visiblePoints.push({ country, score, x, y, isMatch });
      });

      visiblePoints.sort((a, b) => a.isMatch - b.isMatch).forEach(p => {
        const isHovered = hoveredCountry && hoveredCountry.country.index === p.country.index;

        ctx.beginPath();
        ctx.arc(p.x, p.y, isHovered ? 8 : (p.isMatch ? 5 : 3), 0, Math.PI * 2);

        if (p.isMatch) {
          ctx.fillStyle = isHovered ? "#c9a6f5" : "#e0dff0";
          ctx.shadowColor = isHovered ? "#9b59d9" : "transparent";
          ctx.shadowBlur = 10;
        } else {
          ctx.fillStyle = "#4a4358";
          ctx.shadowBlur = 0;
        }
        ctx.fill();
        ctx.shadowBlur = 0;

        // Label unter dem Punkt
        if (p.isMatch) {
          ctx.fillStyle = isHovered ? "#c9a6f5" : "#e0dff0";
          ctx.font = isHovered ? "bold 12px sans-serif" : "10px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(p.country.name, p.x, p.y + (isHovered ? 20 : 15));
        }
      });
    }

    // --- HOVER INTERAKTION ---
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      let found = null;

      countriesData.forEach(country => {
        const cId = String(country.index);
        const score = scoresData[cId]?.[selectedYear];
        if (!score) return;

        const { x, y } = valToPx(score.left_right, score.lib_auth);
        const dist = Math.hypot(mouseX - x, mouseY - y);

        if (dist < 12) {
          found = { country, score, x, y };
        }
      });

      hoveredCountry = found;
      drawCompass();

      if (found) {
        const evalInfo = evaluationsData.evaluations?.[found.score.rubric_id] || {};
        
        const flagUrl = found.country.code 
          ? `<img src="https://flagcdn.com/20x15/${found.country.code.toLowerCase()}.png" alt="" style="vertical-align:middle;">` 
          : "🌐";

        document.getElementById('tt-title').innerHTML = `${flagUrl} ${found.country.name}`;
        document.getElementById('tt-coords').innerText = `Left/Right: ${found.score.left_right} | Lib/Auth: ${found.score.lib_auth}`;
        document.getElementById('tt-summary').innerText = evalInfo.summary || "Keine Zusammenfassung";
        
        const just = evalInfo.justification || {};
        const descText = [just.left_right, just.lib_auth].filter(Boolean).join(" • ");
        document.getElementById('tt-desc').innerText = descText || "Keine Details vorhanden.";

        tooltip.style.display = 'block';
        tooltip.style.left = `${Math.min(mouseX + 15, rect.width - 290)}px`;
        tooltip.style.top = `${Math.min(mouseY + 15, rect.height - 150)}px`;
      } else {
        tooltip.style.display = 'none';
      }
    });

    canvas.addEventListener('mouseleave', () => {
      hoveredCountry = null;
      tooltip.style.display = 'none';
      drawCompass();
    });

    loadData();
  </script>
</body>
</html>
